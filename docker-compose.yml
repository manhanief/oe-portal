services:
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    platform: linux/arm64
    container_name: oe-oracle
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
    ports:
      - "${ORACLE_PORT}:1521"
    volumes:
      - oe-oradata:/opt/oracle/oradata
      - ./db/sample-schemas:/opt/sample-schemas:ro
    restart: unless-stopped

volumes:
  oe-oradata: